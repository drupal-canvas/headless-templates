@if (variant === 'link_card') {
<a
  [href]="link"
  class="group flex flex-col rounded-xl border border-gray-200 bg-white shadow-sm transition hover:shadow-md focus:shadow-md focus:outline-none"
  ><div class="p-4 md:p-5">
    <div class="flex items-center justify-between gap-x-3">
      <div class="flex grow items-center gap-x-3">
        @if (image?.src && image) {
        <img
          [src]="image.src"
          [alt]="image.alt || ''"
          [attr.width]="image.width"
          [attr.height]="image.height"
          class="size-9.5 rounded-full object-cover"
        />
        }
        <div [class]="'grow ' + linkCardTextAlign[layout]">
          <h3 class="font-semibold text-gray-800 group-hover:text-primary-600">
            {{ heading }}
          </h3>
          @if (text) {
          <p class="text-sm text-gray-500"><canvas-markup [html]="text" /></p>
          }
        </div>
      </div>
      <svg
        aria-hidden="true"
        class="size-5 shrink-0 text-gray-800"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </div></div
></a>
} @else { @if (link && !linkLabel) {
<a [href]="link"><ng-container [ngTemplateOutlet]="body" /></a> } @else {
<div><ng-container [ngTemplateOutlet]="body" /></div>
} }
<ng-template #body>
  <div
    [class]="'flex w-full max-w-md flex-col items-center gap-4 rounded-2xl pb-6 leading-[normal] hover:bg-[var(--card-background-hover)] ' + align[layout] + ' ' + textColors[textColor] + (image?.src ? '' : ' pt-8')"
    [style.backgroundColor]="backgroundColor"
    [style.--card-background-hover]="backgroundColorOnHover"
  >
    @if (image?.src && image) {
    <img
      [src]="image.src"
      [alt]="image.alt || ''"
      [attr.width]="image.width"
      [attr.height]="image.height"
      class="w-full rounded-2xl object-cover object-center"
    />
    }
    <div class="px-6 pt-2">
      @if (heading) {
      <div class="mb-2">
        <app-heading
          [heading]="heading"
          [headingElement]="headingElement"
          headingSize="small"
          [layout]="layout"
          [textColor]="textColor === 'Light' ? 'light' : 'dark'"
        />
      </div>
      } @if (byline) {
      <div class="mt-3 mb-2 text-xs font-semibold text-gray-500">
        {{ byline }}
      </div>
      } @if (text) {
      <div class="mb-4 leading-6"><canvas-markup [html]="text" /></div>
      } @if (link && linkLabel) {
      <app-button [link]="link" [text]="linkLabel" [variant]="linkVariant" /> }
    </div>
  </div>
</ng-template>
